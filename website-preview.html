<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1b2fa6;--soft:#4a63e0;--bg1:#f3f6ff;--bg2:#dfe7ff;--text:#14226e;--muted:#5d6aa8;--card:rgba(255,255,255,.88);--line:rgba(74,99,224,.25);--field:#fff;--err:#d93a4a}
@media (prefers-color-scheme:dark){:root{--blue:#8da0ff;--soft:#5b72f0;--bg1:#0b1033;--bg2:#141c55;--text:#e6ebff;--muted:#a9b4ea;--card:rgba(24,32,96,.82);--line:rgba(141,160,255,.3);--field:#0f1647}}
html,body{height:100%;margin:0}
body{font-family:Poppins,Cairo,"Segoe UI",system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 20%,var(--bg1),var(--bg2));background-color:var(--bg1);overflow:hidden}
.view{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;transition:opacity .9s,transform .9s;box-sizing:border-box;padding:max(24px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px))}
.view.hidden{opacity:0;pointer-events:none;transform:scale(1.03)}
#intro{justify-content:center}#page1{overflow-y:auto;overflow-x:hidden}
.bubbles{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bubbles i{position:absolute;bottom:-80px;border-radius:50%;background:var(--soft);opacity:.13;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) scale(1.3);opacity:0}}
.stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo-wrap{position:relative;margin:0 auto;width:min(260px,62vw);aspect-ratio:1;opacity:0;transform:scale(.6) rotate(-8deg);animation:pop 1.2s cubic-bezier(.2,1.3,.4,1) .2s forwards}
.logo-wrap::before,.logo-wrap::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--soft);opacity:.5;animation:ring 2.8s ease-out infinite}
.logo-wrap::after{animation-delay:1.4s}
.logo{width:100%;height:100%;border-radius:50%;background:#fff;box-shadow:0 18px 50px rgba(27,47,166,.28);display:grid;place-items:center;color:var(--blue);font-weight:800;font-size:2rem;text-align:center;line-height:1.1;animation:float 5s ease-in-out 1.4s infinite}
.logo small{display:block;font-size:.7rem;font-weight:600;color:var(--muted)}
@keyframes pop{to{opacity:1;transform:none}}@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.5);opacity:0}}@keyframes float{50%{transform:translateY(-8px)}}
.msg{margin-top:clamp(64px,11vh,96px);width:100%;text-align:center}
.l1{display:block;font-weight:800;font-size:clamp(1.9rem,7vw,3.4rem);line-height:1.2;opacity:0;animation:fadeup 1s ease 1.1s forwards}
.t{position:relative;display:inline-block}
.w{background:linear-gradient(100deg,var(--blue) 20%,var(--soft) 42%,#9fb0ff 50%,var(--soft) 58%,var(--blue) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 4s linear 2.2s infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.sp{position:absolute;top:0;animation:twinkle 2.4s ease-in-out 2s infinite}.sp.r{left:100%;margin-left:.3em}.sp.l{right:100%;margin-right:.3em}
@keyframes twinkle{50%{transform:scale(1.25) rotate(12deg);opacity:.65}}
.l2{display:table;margin:20px auto 0;padding:.55em 1.7em;border-radius:999px;border:1.5px solid var(--line);background:rgba(120,140,255,.14);box-shadow:0 6px 20px rgba(27,47,166,.12);font-weight:600;font-size:clamp(.95rem,3.2vw,1.3rem);letter-spacing:.06em;color:var(--blue);opacity:0;animation:fadeup 1s ease 1.8s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bar{margin:22px auto 0;width:140px;height:4px;border-radius:4px;background:rgba(74,99,224,.2);overflow:hidden;opacity:0;transition:opacity .5s}
.bar.on{opacity:1}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--soft),var(--blue))}.bar.on span{animation:load 2.2s linear forwards}
@keyframes load{to{width:100%}}
.portrait{position:relative;width:clamp(150px,38vw,210px);aspect-ratio:1;margin:clamp(18px,3.5vh,30px) auto 0;border-radius:50%;padding:5px;background:linear-gradient(135deg,var(--soft),#9fb0ff,var(--blue));box-shadow:0 20px 55px rgba(27,47,166,.35);opacity:0;transform:scale(.7);animation:pop 1.1s cubic-bezier(.2,1.3,.4,1) 1.4s forwards}
.portrait::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--soft);opacity:.45;animation:ring 3s ease-out 2.2s infinite}
.portrait img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:4px solid #fff}
.mini{object-fit:cover}
.tick{width:76px;height:76px;margin:-38px auto 12px;position:relative;border-radius:50%;border:4px solid var(--card);background:linear-gradient(135deg,var(--soft),var(--blue));color:#fff;font-size:2.3rem;display:grid;place-items:center;animation:pop .8s cubic-bezier(.2,1.3,.4,1) .3s both}
.thanks{padding:0;overflow:hidden;text-align:center}.thanks .body{padding:0 24px 28px}
.tphoto{position:relative}.tphoto img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.tphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(20,34,110,.6))}
.tphoto span{position:absolute;z-index:1;left:20px;right:20px;bottom:46px;color:#fff;font-weight:800;font-size:clamp(1.3rem,5vw,1.9rem);text-shadow:0 2px 10px rgba(0,0,0,.55)}
.sign{margin:14px 0 0;font-weight:600;color:var(--blue)}
.bgphoto{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.16;filter:blur(1.5px) saturate(.9);z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 35%,#000 70%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 35%,#000 70%,transparent)}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-inline-end:12px;margin-block:-6px;border:2px solid var(--soft);box-shadow:0 4px 12px rgba(27,47,166,.3)}
.banner{padding:0!important;overflow:hidden;position:relative;border-top:0!important;display:block!important}
.banner img{display:block;width:100%;height:clamp(130px,26vw,200px);object-fit:cover}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,rgba(20,34,110,.55))}
.banner span{position:absolute;z-index:1;left:20px;right:20px;bottom:12px;color:#fff;font-weight:600;font-size:.95rem;text-shadow:0 2px 8px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){.bgphoto{opacity:.22}}
.wrap{position:relative;z-index:1;width:100%;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 24px;margin-bottom:16px;box-shadow:0 10px 30px rgba(27,47,166,.1);backdrop-filter:blur(8px);animation:fadeup .6s ease both;animation-delay:calc(var(--i,0)*70ms)}
.head{display:flex;align-items:center;gap:16px;border-top:6px solid var(--soft)}
.mini{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 6px 16px rgba(27,47,166,.25);flex:none;display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:.8rem}
.head h1{margin:0 0 4px;font-size:1.35rem}.desc{margin:0;color:var(--muted)}
.prog{height:8px;border-radius:99px;background:rgba(74,99,224,.18);overflow:hidden;margin:0 0 18px}.prog div{height:100%;width:50%;background:linear-gradient(90deg,var(--soft),var(--blue));border-radius:99px}
.qt{display:block;font-weight:600;margin-bottom:10px}.req{color:var(--err);margin-inline-start:4px}
input[type=text],select{width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;color:var(--text);background:var(--field)}
.opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--field)}
.opt:has(input:checked){border-color:var(--soft);background:rgba(120,140,255,.18)}.opt input{accent-color:var(--soft)}
.nav{display:flex;margin:24px 0 40px}
.btn{padding:12px 28px;border:0;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;background:linear-gradient(90deg,var(--soft),var(--blue));color:#fff;margin-inline-start:auto;box-shadow:0 8px 20px rgba(27,47,166,.3)}
.replay{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top,0px));right:10px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--blue);font:inherit;font-size:.8rem;cursor:pointer}
</style></head><body>
<div class="bubbles" id="bubbles"></div>
<main id="intro" class="view"><div class="bgphoto" id="bgPhoto"></div>
<div class="stage"><div class="logo-wrap"><div class="logo"><div>AASTMT<small>your logo here</small></div></div></div>
<div class="msg"><span class="l1"><span class="t"><span class="sp l">✨</span><span class="w">Welcome Abroad</span><span class="sp r">✨</span></span></span>
<span class="l2">DR Wael Abbas</span></div>
<div class="bar" id="bar"><span></span></div></div></main>
<main id="page1" class="view hidden"><button class="replay" onclick="replay()">↻ Replay intro</button><div class="wrap">
<div class="card banner"><img id="bannerImg" alt="AASTMT campus"><span>Arab Academy for Science, Technology &amp; Maritime Transport</span></div>
<div class="card head"><div class="mini">AASTMT</div><div><h1>Page 1</h1><p class="desc">Sample questions shown here (your live form loads from Google Sheets).</p></div></div>
<div class="prog"><div></div></div>
<div class="card"><label class="qt">Full name / الاسم بالكامل<span class="req">*</span></label><input type="text" dir="auto"></div>
<div class="card"><label class="qt">College / الكلية</label><select><option>Choose / اختر</option><option>Management &amp; Technology</option><option>Maritime Transport &amp; Technology</option></select></div>
<div class="card"><label class="qt">How did you hear about us?</label><label class="opt"><input type="radio" name="a"><span>Social media</span></label><label class="opt"><input type="radio" name="a"><span>A friend</span></label><label class="opt"><input type="radio" name="a"><span>Other</span></label></div>
<div class="nav"><button class="btn" onclick="finish()">Submit / إرسال</button></div></div></main>
