.view{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;transition:opacity .9s ease,transform .9s ease;box-sizing:border-box;padding:max(24px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px))}
.view.hidden{opacity:0;pointer-events:none;transform:scale(1.03)}
#intro{justify-content:center}
#page1{overflow-y:auto;overflow-x:hidden}
.bubbles{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bubbles i{position:absolute;bottom:-80px;border-radius:50%;background:var(--soft);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 0 16px rgba(255,255,255,.22);opacity:.18;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) scale(1.3);opacity:0}}
.stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo-wrap{position:relative;margin:0 auto;width:min(260px,62vw);aspect-ratio:1;opacity:0;transform:scale(.6) rotate(-8deg);animation:pop 1.2s cubic-bezier(.2,1.3,.4,1) .2s forwards}
.logo-wrap::before,.logo-wrap::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--soft);opacity:.5;animation:ring 2.8s ease-out infinite}
.logo-wrap::after{animation-delay:1.4s}
.logo{width:100%;height:100%;border-radius:50%;background:#fff;padding:4px;box-sizing:border-box;box-shadow:0 18px 50px rgba(27,47,166,.28);object-fit:contain;animation:float 5s ease-in-out 1.4s infinite}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.5);opacity:0}}
@keyframes float{50%{transform:translateY(-8px)}}
.msg{margin-top:clamp(64px,11vh,96px);width:100%;text-align:center}
.l1{display:block;font-weight:800;font-size:clamp(1.9rem,7vw,3.4rem);letter-spacing:-.01em;line-height:1.2;opacity:0;animation:fadeup 1s ease 1.1s forwards}
.t{position:relative;display:inline-block}
.w{background:linear-gradient(100deg,var(--blue) 20%,var(--soft) 42%,#9fb0ff 50%,var(--soft) 58%,var(--blue) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 4s linear 2.2s infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.sp{position:absolute;top:0;animation:twinkle 2.4s ease-in-out 2s infinite}
.sp.r{left:100%;margin-left:.3em}.sp.l{right:100%;margin-right:.3em}
@keyframes twinkle{50%{transform:scale(1.25) rotate(12deg);opacity:.65}}
.l2{display:table;margin:20px auto 0;padding:.55em 1.7em;border-radius:999px;border:1.5px solid var(--line);background:rgba(120,140,255,.14);box-shadow:0 6px 20px rgba(27,47,166,.12);font-weight:600;font-size:clamp(.95rem,3.2vw,1.3rem);letter-spacing:.06em;color:var(--blue);opacity:0;animation:fadeup 1s ease 1.8s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bar{margin:22px auto 0;width:140px;height:4px;border-radius:4px;background:rgba(74,99,224,.2);overflow:hidden;opacity:0;transition:opacity .5s}
.bar.on{opacity:1}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--soft),var(--blue))}
.bar.on span{animation:load 2.2s linear forwards}
@keyframes load{to{width:100%}}
/* page 1 */
.wrap{position:relative;z-index:1;width:100%;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 24px;margin-bottom:16px;box-shadow:0 10px 30px rgba(27,47,166,.1);backdrop-filter:blur(8px);animation:fadeup .6s ease both;animation-delay:calc(var(--i,0)*70ms)}
.head{display:flex;align-items:center;gap:16px;border-top:6px solid var(--soft)}
.head img{width:64px;height:64px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 6px 16px rgba(27,47,166,.25);flex:none}
.head h1{margin:0 0 4px;font-size:1.35rem;line-height:1.35}
.desc{margin:0;color:var(--muted);white-space:pre-line}
.chip{display:inline-block;margin-bottom:10px;padding:2px 12px;border-radius:99px;background:rgba(120,140,255,.18);color:var(--blue);font-size:.8rem}
.prog{height:8px;border-radius:99px;background:rgba(74,99,224,.18);overflow:hidden;margin:0 0 18px}
.prog div{height:100%;width:0;background:linear-gradient(90deg,var(--soft),var(--blue));border-radius:99px;transition:width .5s ease}
.qt{display:block;font-weight:600;font-size:1.05rem;margin-bottom:6px}
.req{color:var(--err);margin-inline-start:4px}
.help{font-size:.9rem;color:var(--muted);margin-bottom:12px}
input[type=text],textarea,select{width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;color:var(--text);background:var(--field);transition:border-color .2s,box-shadow .2s}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--soft);box-shadow:0 0 0 4px rgba(74,99,224,.18)}
.opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--field);transition:transform .15s,border-color .15s,background .15s}
.opt:hover{transform:translateX(3px);border-color:var(--soft)}
.opt:has(input:checked){border-color:var(--soft);background:rgba(120,140,255,.18)}
.opt input{width:18px;height:18px;accent-color:var(--soft);flex:none}
.err{display:none;color:var(--err);font-size:.9rem;margin-top:8px}
.card.bad{border-color:var(--err);animation:shake .35s}
.card.bad .err{display:block}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.nav{display:flex;gap:12px;margin:24px 0 40px}
.btn{padding:12px 28px;border:0;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:linear-gradient(90deg,var(--soft),var(--blue));color:#fff;margin-inline-start:auto;box-shadow:0 8px 20px rgba(27,47,166,.3)}
.btn.s{background:rgba(120,140,255,.2);color:var(--blue)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
 .done{text-align:center;padding:22px 18px 34px;background:rgba(9,15,54,.94);border:1px solid rgba(91,114,240,.52);box-shadow:0 14px 38px rgba(0,0,0,.34)}
.thanks-campus{position:relative;height:clamp(120px,24vw,180px);margin:0 auto 18px;border-radius:18px;overflow:hidden;border:1px solid rgba(91,114,240,.75);box-shadow:0 8px 24px rgba(0,0,0,.28)}
.thanks-campus img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 48%}
.thanks-campus:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,10,39,.82),rgba(5,10,39,.08) 72%)}
.thanks-campus span{position:absolute;z-index:1;left:18px;right:18px;bottom:14px;text-align:left;color:#fff;font-size:clamp(.75rem,2.5vw,.98rem);font-weight:700;text-shadow:0 2px 8px #000}
.thanks-person{position:relative;width:100%;max-width:630px;margin:0 auto 18px;border:2px solid rgba(91,114,240,.62);border-radius:18px;overflow:hidden;background:#080f35;box-shadow:0 12px 30px rgba(0,0,0,.42)}
.thanks-person img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;object-position:center;border:0;border-radius:0;filter:none}
.thanks-speech{position:absolute;left:18px;top:18px;padding:10px 16px;border-radius:18px 18px 18px 4px;background:rgba(8,20,68,.92);color:#fff;font-weight:800;font-size:clamp(.9rem,3vw,1.25rem);box-shadow:0 0 22px rgba(50,105,255,.48);border:2px solid #477bff}
.thanks-response{font-size:clamp(1.25rem,4vw,1.8rem);font-weight:800;line-height:1.35;margin:12px 0 22px;color:#f2f5ff}
.thanks-response .accent{color:#9eb2ff}
.thanks-signoff{margin-top:14px;color:#91a8ff;font-weight:800}
@media(max-width:420px){.done{padding:16px 12px 28px}.thanks-campus{height:130px}.thanks-speech{left:10px;top:10px;padding:7px 11px;font-size:.85rem}.thanks-person{border-radius:14px}}
.tick{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,var(--soft),var(--blue));color:#fff;font-size:2.6rem;display:grid;place-items:center;animation:pop .8s cubic-bezier(.2,1.3,.4,1) both}
@media (prefers-reduced-motion:reduce){.bubbles i,.logo,.logo-wrap::before,.logo-wrap::after,.w,.sp{animation:none}.logo-wrap,.l1,.l2{animation-duration:.01s;animation-delay:0s}}
</style>
</head>

const TYPES={text:"TEXT",short:"TEXT",paragraph:"PARAGRAPH_TEXT",paragraph_text:"PARAGRAPH_TEXT",long:"PARAGRAPH_TEXT",choice:"MULTIPLE_CHOICE",radio:"MULTIPLE_CHOICE",multiple_choice:"MULTIPLE_CHOICE",checkbox:"CHECKBOX",checkboxes:"CHECKBOX",dropdown:"LIST",list:"LIST",page:"PAGE_BREAK",header:"SECTION_HEADER"};
// Questions tab columns: Section | Question | Type | Help Text | Required | Choices | Next / Go To
function rowsToItems(rows){
  const g=(r,k)=>{const key=Object.keys(r).find(x=>x.trim().toLowerCase()===k);return key?String(r[key]).trim():"";};
  const items=[];let prev=null;
  rows.forEach((r,i)=>{const title=g(r,"question");if(!title)return;
    const sec=g(r,"section");
    if(prev!==null&&sec&&sec!==prev)items.push({id:"sec"+sec,type:"PAGE_BREAK",title:"",helpText:""});
    if(sec)prev=sec;
    const type=TYPES[(g(r,"type")||"text").toLowerCase().replace(/\s+/g,"_")]||"TEXT";
    const it={id:"q"+i,type:type,title:title,required:/^(yes|true|1|y|\*)$/i.test(g(r,"required")),helpText:g(r,"help text")};
    const ch=g(r,"choices");
    if(/CHOICE|CHECKBOX|LIST/.test(type))it.choices=ch.split("|").map(c=>c.trim()).filter(Boolean).map(v=>({value:v}));
    items.push(it);});
  return items;
}
function loadForm(){
  if(loaded)return;loaded=true;
  const bad=e=>{loaded=false;document.getElementById("ftitle").textContent="Unable to load questions";document.getElementById("fdesc").textContent="Please check the SheetDB link and the Questions tab.";console.error(e);};
  if(API_URL.indexOf("PASTE")===0){bad("API_URL not set");return;}
  fetch(API_URL+"?sheet=Questions").then(r=>r.json()).then(rows=>{
    if(!Array.isArray(rows))throw rows;
    document.getElementById("ftitle").textContent=FORM_TITLE;
    build(rowsToItems(rows));document.getElementById("prog").style.display="block";render();
  }).catch(bad);
}
function build(items){
  let cur={id:"start",title:"",description:"",goToPageId:null,pageNavType:"CONTINUE",questions:[]};sections=[cur];
  items.forEach(it=>{
    if(it.type==="PAGE_BREAK"){cur={id:it.id,title:it.title,description:it.helpText,goToPageId:it.goToPageId,pageNavType:it.pageNavType||"CONTINUE",questions:[]};sections.push(cur);}
    else if(["TEXT","PARAGRAPH_TEXT","MULTIPLE_CHOICE","CHECKBOX","LIST","SECTION_HEADER"].includes(it.type))cur.questions.push(it);
  });
}
function render(){
  const si=hist[hist.length-1],sec=sections[si];formEl.innerHTML="";
  document.getElementById("pf").style.width=Math.round((si+1)/sections.length*100)+"%";
  let n=1;
  if(sec.title||sec.description){const b=document.createElement("div");b.className="card";b.style.setProperty("--i",n++);b.innerHTML=(sec.title?`<h2 dir="auto" style="margin:0 0 6px;font-size:1.2rem">${esc(sec.title)}</h2>`:"")+(sec.description?`<p dir="auto" class="desc">${esc(sec.description)}</p>`:"");formEl.appendChild(b);}
  sec.questions.forEach(q=>{
    const c=document.createElement("div");c.className="card";c.style.setProperty("--i",n++);c.dataset.id=q.id;c.dataset.type=q.type;
    if(q.type==="SECTION_HEADER"){c.innerHTML=`<h3 dir="auto" style="margin:0 0 4px">${esc(q.title)}</h3><p dir="auto" class="desc">${esc(q.helpText)}</p>`;formEl.appendChild(c);return;}
    c.innerHTML=`<label class="qt" dir="auto">${esc(q.title)}${q.required?'<span class="req">*</span>':""}</label>`+(q.helpText?`<div class="help" dir="auto">${esc(q.helpText)}</div>`:"");
    const v=answers[q.id];let f="";
    if(q.type==="TEXT")f=`<input type="text" dir="auto" value="${esc(v)}">`;
    else if(q.type==="PARAGRAPH_TEXT")f=`<textarea rows="4" dir="auto">${esc(v)}</textarea>`;
    else if(q.type==="LIST")f=`<select dir="auto"><option value="">Choose / اختر</option>`+q.choices.map(x=>`<option value="${esc(x.value)}"${v===x.value?" selected":""}>${esc(x.value)}</option>`).join("")+`</select>`;
    else if(q.type==="MULTIPLE_CHOICE")f=q.choices.map(x=>`<label class="opt" dir="auto"><input type="radio" name="q_${esc(q.id)}" value="${esc(x.value)}"${v===x.value?" checked":""}><span>${esc(x.value)}</span></label>`).join("");
    else if(q.type==="CHECKBOX"){const a=Array.isArray(v)?v:[];f=q.choices.map(x=>`<label class="opt" dir="auto"><input type="checkbox" value="${esc(x.value)}"${a.includes(x.value)?" checked":""}><span>${esc(x.value)}</span></label>`).join("");}
    c.insertAdjacentHTML("beforeend",f+`<div class="err">This question is required / هذا السؤال مطلوب</div>`);
    formEl.appendChild(c);
  });
  formEl.onchange=()=>{collect();buttons();};
  buttons();
  page1.scrollTo({top:0,behavior:"smooth"});
}
function collect(){
  formEl.querySelectorAll(".card[data-id]").forEach(c=>{
    const id=c.dataset.id,t=c.dataset.type;
    if(t==="TEXT")answers[id]=c.querySelector("input").value.trim();
    else if(t==="PARAGRAPH_TEXT")answers[id]=c.querySelector("textarea").value.trim();
    else if(t==="LIST")answers[id]=c.querySelector("select").value;
    else if(t==="MULTIPLE_CHOICE"){const r=c.querySelector("input:checked");answers[id]=r?r.value:"";}
    else if(t==="CHECKBOX")answers[id]=[...c.querySelectorAll("input:checked")].map(i=>i.value);
  });
}
function validate(){
  let ok=true,first=null;
  formEl.querySelectorAll(".card[data-id]").forEach(c=>{
    const q=sections[hist[hist.length-1]].questions.find(x=>String(x.id)===c.dataset.id),v=answers[c.dataset.id];
    const empty=!v||(Array.isArray(v)&&!v.length);
    c.classList.remove("bad");
    if(q&&q.required&&empty){c.classList.add("bad");ok=false;first=first||c;}
  });
  if(first)first.scrollIntoView({behavior:"smooth",block:"center"});
  return ok;
}
function resolve(type,gid,i){
  if(type==="SUBMIT")return"submit";if(type==="RESTART")return 0;
  if(type==="GO_TO_PAGE"){const k=sections.findIndex(s=>String(s.id)===String(gid));return k>=0?k:"submit";}
  return i+1<sections.length?i+1:"submit";
}
function nextOf(i){
  const sec=sections[i];
  for(const q of sec.questions){
    if(q.type!=="MULTIPLE_CHOICE"&&q.type!=="LIST")continue;
    const ch=(q.choices||[]).find(c=>c.value===answers[q.id]);
    if(ch&&ch.pageNavType&&ch.pageNavType!=="CONTINUE")return resolve(ch.pageNavType,ch.goToPageId,i);
  }
  return resolve(sec.pageNavType,sec.goToPageId,i);
}
function buttons(){
  const i=hist[hist.length-1],last=nextOf(i)==="submit";
  navEl.innerHTML=(hist.length>1?'<button type="button" class="btn s" id="bk">← Back / السابق</button>':"")+`<button type="button" class="btn p" id="nx">${last?"Submit / إرسال":"Next / التالي →"}</button>`;
  const bk=document.getElementById("bk");
  if(bk)bk.onclick=()=>{collect();hist.pop();render();};
  document.getElementById("nx").onclick=()=>{collect();if(!validate())return;const t=nextOf(i);if(t==="submit")submit();else{hist.push(t);render();}};
}
